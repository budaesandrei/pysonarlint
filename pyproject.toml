[project]
name = "pysonarlint"
version = "0.1.0"
description = "Report the issues SonarQube for IDE would highlight, from your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "budaesandrei" }
]
keywords = ["sonarlint", "sonarqube", "linter", "static-analysis", "code-quality", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately dependency-free: a linter invoked in a loop should not pay import cost,
# and the standard library already covers framed JSON-RPC, TOML, and arg parsing.
dependencies = []

[project.urls]
Homepage = "https://github.com/budaesandrei/pysonarlint"
Issues = "https://github.com/budaesandrei/pysonarlint/issues"
Changelog = "https://github.com/budaesandrei/pysonarlint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
pysonarlint = "pysonarlint.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
