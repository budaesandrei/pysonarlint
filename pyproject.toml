[project]
name = "pysonarlint"
version = "0.1.0"
description = "Report the issues SonarQube for IDE would highlight, from your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "budaesandrei" }
]
keywords = ["sonarlint", "sonarqube", "linter", "static-analysis", "code-quality", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately dependency-free: a linter invoked in a loop should not pay import cost,
# and the standard library already covers framed JSON-RPC, TOML, and arg parsing.
dependencies = []

[project.urls]
Homepage = "https://github.com/budaesandrei/pysonarlint"
Issues = "https://github.com/budaesandrei/pysonarlint/issues"
Changelog = "https://github.com/budaesandrei/pysonarlint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
pysonarlint = "pysonarlint.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rather than inherited: several `# noqa` comments in the codebase name
# codes from these sets, and without `select` ruff runs its small default set and
# then flags every one of those comments as unused.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "S", "N", "BLE"]
ignore = [
    "ANN401",  # Any is the honest type for JSON-RPC payloads
    "S101",    # assert is correct in tests
    "S603",    # subprocess is the whole point; the command is built from vetted paths
    "S607",    # same
    "S310",    # urlopen: the scheme is validated when the URL is normalised
    "S110",    # try/except/pass is deliberate where a failure must not block analysis
    "N818",    # LspError reads better than LspException for a protocol fault
]

[tool.ruff.lint.per-file-ignores]
# LSP method names are camelCase on the wire, and the handlers mirror them.
"src/pysonarlint/lsp.py" = ["N802"]
# Tests reach into private helpers deliberately: that is where the protocol logic
# lives, and testing it through the public surface would need a live JVM.
# Test fixtures use obviously-fake token literals; flagging them as hardcoded
# credentials is noise, and real secrets are covered by gitleaks in CI.
"tests/*" = ["ANN001", "SLF001", "D107", "S105", "S106", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
show_missing = true
# Lines that cannot be executed by a test by construction, rather than lines that are
# merely inconvenient to reach. Anything genuinely reachable is expected to be covered.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
    "\\.\\.\\.",
]
