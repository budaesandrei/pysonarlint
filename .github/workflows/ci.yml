name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      # The unit tests deliberately do not need the Java engine, so they run on
      # every platform without installing an IDE extension.
      - run: uv run --python ${{ matrix.python }} --group dev pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev --with pytest-cov pytest -q --cov=pysonarlint --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage reporting must not gate a release; the test job is the gate.
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with ruff ruff check src tests
      - run: uv run --with ruff ruff format --check src tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Static analysis for common Python security mistakes.
      - run: uv run --with bandit bandit -r src -ll
      # Dependency advisories. The package has no runtime dependencies, so this
      # guards the dev tooling and any future addition.
      - run: uv run --with pip-audit pip-audit --strict || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan every commit
      # The gitleaks binary rather than gitleaks-action: the action gates features
      # behind a licence check and its logs are not readable without admin rights,
      # which makes a failure impossible to diagnose from outside the repo.
      - name: Scan history for secrets
        run: |
          VERSION=8.30.1
          curl -sSL --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # 'git' scans commit history; 'detect' was removed in 8.19.
          ./gitleaks git . --redact --verbose --exit-code 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
