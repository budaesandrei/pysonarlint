version: 2
updates:
  # The package has no runtime dependencies; this keeps the CI actions current, which is
  # where supply-chain risk actually sits for this project.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
